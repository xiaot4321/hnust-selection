server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: HNUSTSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: hnust-selection
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hnust_selection?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
