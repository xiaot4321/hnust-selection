server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: HNUSTSESSION
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  application:
    name: hnust-selection
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/hnust_selection?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    # 数据库密码必须由进程环境注入；仓库配置不提供可被误用于其他环境的默认口令。
    password: ${DB_PASSWORD:qwe123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  jackson:
    time-zone: UTC

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  email:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  # 导入源文件只放在 Web 根目录之外；部署时可通过环境变量改到受控的私有盘。
  private-storage:
    directory: ${PRIVATE_FILE_STORAGE:./var/private-files}
  # 简历和导师头像写入 OSS 私有对象；浏览器只收到经服务端授权的短时签名头像地址。
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    bucket: ${OSS_BUCKET:hnust-selection}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
